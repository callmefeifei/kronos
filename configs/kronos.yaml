auth:
    access_token_ttl: 12h
    jwt_secret: ""  # auto-generated on first run
    refresh_token_ttl: 168h
database:
    mysql:
        database: ""
        enabled: false
        host: ""
        password: ""
        port: 3306
        user: ""
    redis:
        db: 0
        enabled: false
        host: ""
        password: ""
        port: 6379
    sqlite:
        path: ~/.kronos/kronos.db
log:
    format: text
    level: info
mcp:
    enabled: true
    host: 127.0.0.1
    port: 8361
    token: ""  # auto-generated on first run
notifier:
    feishu:
        enabled: false
        webhook_url: ""
    webhook:
        enabled: false
        url: ""
    wechat:
        enabled: false
        url: "https://api.ossec.cn/v1/send"
        token: ""
scheduler:
    max_concurrent: 10
    cleanup_retention_days: 30  # auto-delete task runs older than N days (0 = disabled)
    cleanup_interval_hours: 6   # how often to run cleanup
server:
    host: 0.0.0.0
    mode: release
    port: 8360
